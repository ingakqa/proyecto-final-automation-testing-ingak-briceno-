name: Suite de Pruebas Automation QA (UI & API)
on:
  push:
    branches: [ "master", "maestro", "framework-final", "main" ]
  pull_request:
    branches: [ "master", "maestro", "framework-final", "main" ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Clonar el repositorio de codigo
      uses: actions/checkout@v4
    - name: Configurar entorno de Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Instalar Google Chrome
      uses: browser-actions/setup-chrome@v1
    - name: Instalar dependencias del Framework
      run: |
        python -m pip install --upgrade pip
        pip install selenium pytest pytest-html pytest-check webdriver-manager requests
    - name: Ejecutar la Suite de Pruebas Completa
      env:
        MOZ_HEADLESS: 1
      run: |
        python -m pytest --html=reports/reporte_final.html --self-contained-html
    - name: Almacenar Reportes HTML como Artefactos
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reporte-pytest-html
        path: reports/reporte_final.html
        retention-days: 5
    - name: Almacenar Capturas de Pantalla en caso de Fallos
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: screenshots-evidencia
        path: screenshots/
        retention-days: 5
